<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clínica Faber · Painel de Conteúdos · ArestAgência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040404; --ink:#F8F4F2; --ink-2:#d9d2ce; --muted:#8f8784;
    --line:#232323; --card:#0f0f0f; --card-2:#161616; --accent:#882725; --accent-dark:#3c1e1e; --gold:#F6AD03;
    --radius:14px;
    --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:inherit;text-decoration:none}
  button,select{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  img{display:block;max-width:100%}

  .top{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:center;padding:28px clamp(20px,5vw,64px)}
  .brand{display:flex;align-items:center;gap:12px;color:#fff}
  .brand-mark{width:40px;height:40px;object-fit:contain}
  .brand-name{font-weight:700;letter-spacing:.14em;font-size:15px}
  .top-tag{color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.08em;text-transform:uppercase}

  .hero{position:relative;min-height:min(88vh,780px);display:flex;align-items:flex-end;justify-content:center;text-align:center;overflow:hidden}
  .mosaic{position:absolute;inset:-60px -20px;display:flex;gap:8px}
  /* capa com uma foto inteira, sem corte e sem barras: sempre na largura total, na proporção original.
     Degradê preto no topo (logo) e embaixo, levando a foto até o nome, que sobe um pouco sobre o degradê. */
  .hero.foto{display:block;min-height:0}
  .mosaic.foto{position:relative;inset:auto;display:block;background:#040404}
  .mosaic.foto img{display:block;width:100%;height:auto}
  .hero.foto::after{background:linear-gradient(180deg,rgba(4,4,4,.55) 0%,rgba(4,4,4,0) 16%)}
  .mosaic.foto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(180deg,rgba(4,4,4,0) 0%,rgba(4,4,4,.55) 45%,rgba(4,4,4,.9) 78%,#040404 100%)}
  .hero.foto .hero-inner{position:relative;margin:calc(-1 * clamp(24px,11vw,230px)) auto 0;padding-top:0}
  .destaque{margin-top:clamp(28px,5vh,56px)}
  .destaque .kick{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);text-align:center}
  .destaque h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,48px);text-align:center;margin:10px 0 22px}
  .destaque h3 em{color:var(--gold)}
  .dq{position:relative;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000 center/cover no-repeat;cursor:pointer;border:1px solid #232323}
  .dq iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .dq .dqp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .dq:hover .dqp{transform:translate(-50%,-50%) scale(1.08)}
  .dq .dqp i{display:block;width:0;height:0;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
  .dq-acoes{display:flex;justify-content:center;gap:10px;margin-top:16px}
  .dq-acoes a{border:1px solid #333;border-radius:999px;padding:10px 18px;font-size:14px;color:#fff;text-decoration:none}
  .dq-acoes a:hover{border-color:#555}
  .mes-unico .month h2{display:none}
  .mes-unico .month{margin-top:24px}
  .mcol{flex:1;display:flex;flex-direction:column;gap:8px;animation:drift 70s ease-in-out infinite alternate}
  .mcol:nth-child(even){animation-direction:alternate-reverse;margin-top:-110px}
  .mtile{width:100%;border-radius:6px;background:var(--accent-dark) center/cover no-repeat;flex:none}
  .mtile.v{aspect-ratio:9/16}.mtile.p{aspect-ratio:4/5}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-160px)}}
  @media (prefers-reduced-motion:reduce){.mcol{animation:none}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,4,.75) 0%,rgba(4,4,4,.45) 30%,rgba(4,4,4,.65) 60%,rgba(4,4,4,1) 100%)}
  .tudo{display:inline-flex;align-items:center;gap:12px;margin-top:26px;padding:13px 24px 13px 14px;border-radius:999px;background:#fff;color:#111;text-decoration:none;font-weight:600;font-size:15px;letter-spacing:.01em;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
  .tudo:hover{transform:translateY(-1px);box-shadow:0 12px 36px rgba(0,0,0,.45)}
  .tudo-ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#111;color:#fff;font-size:16px}
  .tudo small{display:block;font-weight:400;font-size:12px;opacity:.6;margin-top:1px}
  .hero-inner{position:relative;z-index:2;color:#fff;padding:0 24px clamp(48px,8vh,88px);max-width:960px}
  .eyebrow{font-size:13px;letter-spacing:.42em;text-transform:uppercase;opacity:.85;margin-bottom:18px}
  .hero h1{font-family:var(--sans);font-weight:700;font-size:clamp(54px,12vw,164px);line-height:.85;letter-spacing:.03em;margin-right:-.03em}
  .hero h1.longo{font-size:clamp(40px,8vw,112px);line-height:.95}
  .hero h2.sub{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.2vw,40px);line-height:1.1;margin-top:18px;color:var(--ink-2)}
  .hero h2.sub em{color:var(--gold);font-style:italic}
  .hero p{margin-top:18px;color:var(--ink-2);font-size:clamp(15px,1.6vw,18px)}
  .stats{display:flex;justify-content:center;gap:clamp(20px,5vw,56px);margin-top:34px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,48px);line-height:1}
  .stat span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  .wrap{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  .bar{position:sticky;top:0;z-index:20;background:rgba(4,4,4,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;flex-direction:column;gap:12px;padding-top:14px;padding-bottom:14px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);min-width:64px}
  [hidden]{display:none!important}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip.off{opacity:.35}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-2);transition:.15s}
  .chip:hover{border-color:#3a3a3a;color:#fff}
  .chip.on{background:var(--ink);color:#0b0b0b;border-color:var(--ink)}
  .chip small{opacity:.55;margin-left:6px;font-size:12px}
  .sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 34px 8px 12px;font-size:14px;color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,#bbb 50%),linear-gradient(135deg,#bbb 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{padding:8px 14px;font-size:14px;color:var(--ink-2)}
  .seg button.on{background:var(--card-2);color:#fff}
  .grow{flex:1}
  .count{font-size:14px;color:var(--muted)}
  .reset{font-size:13px;color:var(--gold);text-decoration:underline;text-underline-offset:3px}

  .month{margin-top:44px}
  .month h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,42px);display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:18px}
  .month h2 span{font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:#3a3a3a}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .grid+.grid{margin-top:8px}
  .grid.wide .thumb{aspect-ratio:16/9}
  .thumb{position:relative;aspect-ratio:9/14;background:var(--accent-dark);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .card:hover .thumb img{transform:scale(1.04)}
  .badge{position:absolute;top:8px;left:8px;font-size:11px;letter-spacing:.06em;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:4px 8px;border-radius:999px;color:#fff}
  .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .play i{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:grid;place-items:center;opacity:.9}
  .play i::after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
  .meta{padding:8px 10px 9px}
  .meta b{display:block;font-weight:500;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .uni .meta>span{display:none!important}
  .meta>span{display:flex;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .empty{padding:80px 0;text-align:center;color:var(--muted)}
  .more{display:block;margin:22px auto 0;border:1px solid var(--line);border-radius:999px;padding:10px 22px;font-size:14px;color:var(--ink-2)}
  .more:hover{color:#fff;border-color:#3a3a3a}

  .lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}
  .lb.open{display:flex}
  .lb-box{display:flex;gap:28px;align-items:center;max-width:1100px;width:100%;max-height:92vh}
  .lb-media{flex:none;height:min(86vh,820px);aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden}
  .lb-media.photo{aspect-ratio:auto;max-width:62vw}
  .lb-media.carr{aspect-ratio:4/5;height:min(80vh,760px)}
  .lb-media.wide{aspect-ratio:16/9;height:auto;width:min(60vw,calc(80vh * 16 / 9),1200px)}
  .lb-media.wide.photo{aspect-ratio:auto;height:auto}
  .trk{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .trk::-webkit-scrollbar{display:none}
  .sl{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
  .sl img,.sl iframe{width:100%;height:100%;border:0;object-fit:contain;display:block}
  .cv{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;z-index:2}
  .cv.p{left:10px}.cv.n{right:10px}.cv[disabled]{opacity:0;pointer-events:none}
  .dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2;pointer-events:none}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .2s}
  .dots i.on{background:#fff;width:18px;border-radius:4px}
  .stack{position:absolute;top:8px;right:8px;width:22px;height:22px;opacity:.95}
  .lb-media{position:relative}
  .lb-media iframe,.lb-media img{width:100%;height:100%;border:0;object-fit:contain}
  .lb-media.scaled iframe{position:absolute;top:0;left:0;width:540px;height:960px;transform-origin:0 0}
  .lb-media.wide.scaled iframe{width:960px;height:540px}
  .lb-info{flex:1;min-width:0;text-align:center}
  .lb-info .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .lb-info h3{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,38px);line-height:1.1;margin:10px 0 14px}
  .lb-info p{color:var(--ink-2);font-size:14px}
  .btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:500}
  .btn.pri{background:var(--ink);color:#0b0b0b}
  .btn.sec{border:1px solid #333;color:#fff}
  .lb-x{position:absolute;top:18px;right:22px;font-size:28px;color:#fff;opacity:.8;width:44px;height:44px}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:30px;color:#fff;opacity:.6;width:48px;height:64px}
  .lb-nav:hover,.lb-x:hover{opacity:1}
  .lb-prev{left:8px}.lb-next{right:8px}
  @media (max-width:760px){
    .lb-box{flex-direction:column;gap:16px;overflow:auto}
    .lb-media{height:auto;width:min(88vw,calc(64vh * 9 / 16))}.lb-media.carr{width:min(92vw,calc(66vh * 4 / 5));height:auto}.lb-media.photo{max-width:100%;height:auto;max-height:62vh}
    .lb-info{text-align:center}.btns{justify-content:center}
    .grid{grid-template-columns:repeat(2,1fr);gap:6px}
    .grid.wide{grid-template-columns:1fr}.grid+.grid{margin-top:6px}
    .lb-media.wide{width:92vw;height:auto}
    .lbl{min-width:auto}
  }
  footer{margin:80px 0 40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>

}
$('#fCli').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(REG){st.reg=b.dataset.v;st.cli=''}else st.cli=b.dataset.v;update()});
$('#fEmp').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.cli=b.dataset.v;update()});
$('#fMes').addEventListener('change',e=>{st.mes=e.target.value;update()});
$('#fTipo').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.tipo=b.dataset.t;update()});
$('#reset').addEventListener('click',()=>{st.cli=st.mes=st.tipo=st.cor=st.reg='';update()});
$('#fCor').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.cor=b.dataset.v;update()});
if(DATA.corretores&&DATA.corretores.length){$('#rowCor').hidden=false;$('#lblCor').textContent=DATA.rotulo_corretores||'Corretor'}

// ---------- lista ----------
let visiveis=[];const LIM=24;const abertos=new Set();
function card(x,i){
  return `<button class="card" data-i="${i}">
    <div class="thumb"><img loading="lazy" src="${thumb(capa(x),480)}" alt="" onerror="this.style.display='none'">
      <span class="badge">${x.tipo==='video'?'Vídeo':x.tipo==='carrossel'?`Carrossel · ${x.slides.length}`:'Foto'}</span>${x.tipo==='video'?'<span class="play"><i></i></span>':''}${x.tipo==='carrossel'?'<svg class="stack" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="7" width="13" height="14" rx="2" fill="rgba(0,0,0,.45)"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>':''}</div>
    <div class="meta"><b>${esc(x.titulo)}</b><span><span class="dot" style="background:${CORES[x.cliente]}"></span>${esc(x.cliente)}${x.cor?` · ${esc(x.cor.join(', '))}`:''}</span></div>
  </button>`;
}
function renderLista(){
  visiveis=I.filter(x=>match(x)).sort((a,b)=>b.mes.localeCompare(a.mes)||(a.fmt==='h'?1:0)-(b.fmt==='h'?1:0)||DATA.clientes.indexOf(a.cliente)-DATA.clientes.indexOf(b.cliente)||(a.tipo===b.tipo?a.titulo.localeCompare(b.titulo):({video:0,carrossel:1,foto:2}[a.tipo]-{video:0,carrossel:1,foto:2}[b.tipo])));
  $('#count').textContent=`${visiveis.length} ${visiveis.length===1?'conteúdo':'conteúdos'}`;
  if(!visiveis.length){$('#lista').innerHTML='<div class="empty">Nenhum conteúdo com esses filtros.</div>';return}
  const g={};visiveis.forEach((x,i)=>(g[x.mes]=g[x.mes]||[]).push([x,i]));
  $('#lista').innerHTML=Object.keys(g).map(m=>{
    const arr=g[m], all=abertos.has(m)||st.mes||arr.length<=LIM||Object.keys(g).length===1&&document.body.classList.contains('mes-unico');
    const mostra=all?arr:arr.slice(0,LIM), hz=mostra.filter(([x])=>x.fmt==='h'), vt=mostra.filter(([x])=>x.fmt!=='h');
    return `<section class="month"><h2>${mesLabel(m)}<span>${conta(arr.map(([x])=>x))}</span></h2>
      ${vt.length?`<div class="grid">${vt.map(([x,i])=>card(x,i)).join('')}</div>`:''}${hz.length?`<div class="grid wide">${hz.map(([x,i])=>card(x,i)).join('')}</div>`:''}
      ${all?'':`<button class="more" data-m="${m}">Ver todos os ${arr.length}</button>`}</section>`;
  }).join('');
}
$('#lista').addEventListener('click',e=>{
  const mo=e.target.closest('.more');if(mo){abertos.add(mo.dataset.m);renderLista();return}
  const c=e.target.closest('.card');if(c)openLb(+c.dataset.i);
});
function update(){writeHash();renderFiltros();renderLista()}

// ---------- destaque (entrega principal, ex.: vídeo 16:9) ----------
if(DESTAQUE.length){
  const d=$('#destaque');d.hidden=false;
  if(!I.some(x=>x.tipo==='video'))document.querySelector('#fTipo [data-t="video"]').hidden=true;
  d.innerHTML=(DATA.destaque_titulo?`<div class="kick">A entrega principal</div><h3>${esc(DATA.destaque_titulo).replace(/&lt;(\/?)em&gt;/g,'<$1em>')}</h3>`:'')+
    DESTAQUE.map(x=>`<div class="dq" data-id="${x.id}" style="background-image:url('${thumb(x.id,1600)}')" role="button" aria-label="Assistir ${esc(x.titulo)}"><span class="dqp"><i></i></span></div>
    <div class="dq-acoes"><a href="${dl(x.id)}">Baixar vídeo</a></div>`).join('');
  d.addEventListener('click',e=>{const v=e.target.closest('.dq');if(!v||v.querySelector('iframe'))return;
    v.innerHTML=`<iframe src="https://drive.google.com/file/d/${v.dataset.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`});
}
// ---------- lightbox ----------
let cur=-1;
function openLb(i){
  cur=i;const x=visiveis[i];
  $('#lbM').className='lb-media'+(x.tipo==='foto'?' photo':x.tipo==='carrossel'?' carr':'')+(x.fmt==='h'&&x.tipo!=='carrossel'?' wide':'');
  if(x.tipo==='carrossel'){abrirCarrossel(x);return}
  $('#lbM').innerHTML=x.tipo==='video'
    ?`<iframe src="https://drive.google.com/file/d/${x.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
    :`<img src="${thumb(x.id,1600)}" alt="">`;
  $('#lbK').textContent=`${x.cliente} · ${mesLabel(x.mes)}`;
  $('#lbT').textContent=x.titulo;
  $('#lbF').textContent=x.arquivo;
  $('#lbD').href=dl(x.id);$('#lbD').textContent='Baixar';
  $('#lb').classList.add('open');document.body.style.overflow='hidden';
  fitPlayer();
}
// Carrossel: slides lado a lado, arrasta com o dedo (scroll-snap) ou pelas setas; ordem = nome dos arquivos
let slide=0;
function abrirCarrossel(x){
  const n=x.slides.length;
  $('#lbM').innerHTML=`<div class="trk" id="trk">${x.slides.map((s,k)=>`<div class="sl">${s.tipo==='video'
      ?`<iframe data-src="https://drive.google.com/file/d/${s.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
      :`<img src="${thumb(s.id,1600)}" alt="Slide ${k+1}" ${k>1?'loading="lazy"':''}>`}</div>`).join('')}</div>
    <button class="cv p" id="cvP" aria-label="Slide anterior">‹</button><button class="cv n" id="cvN" aria-label="Próximo slide">›</button>
    <div class="dots">${x.slides.map(()=>'<i></i>').join('')}</div>`;
  $('#lbK').textContent=`Carrossel · ${n} slides · ${mesLabel(x.mes)}`;
  $('#lbT').textContent=x.titulo;
  const trk=$('#trk');
  const marcar=()=>{
    slide=Math.round(trk.scrollLeft/trk.clientWidth);
    document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===slide));
    $('#cvP').disabled=slide===0;$('#cvN').disabled=slide===n-1;
    $('#lbF').textContent=`Slide ${slide+1} de ${n}`;
    $('#lbD').href=dl(x.slides[slide].id);$('#lbD').textContent=`Baixar slide ${slide+1}`;
    const f=trk.children[slide].querySelector('iframe[data-src]');if(f){f.src=f.dataset.src;f.removeAttribute('data-src')}
  };
  trk.addEventListener('scroll',()=>{clearTimeout(trk._t);trk._t=setTimeout(marcar,60)});
  $('#cvP').onclick=()=>irSlide(-1);$('#cvN').onclick=()=>irSlide(1);
  $('#lb').classList.add('open');document.body.style.overflow='hidden';
  slide=0;marcar();
}
function irSlide(d){const trk=$('#trk');if(!trk)return false;const k=slide+d;if(k<0||k>=trk.children.length)return false;trk.scrollTo({left:k*trk.clientWidth,behavior:'smooth'});return true}
// No celular o player do Drive desenha controles enormes em telas estreitas.
// Renderizamos o iframe em 540x960 e reduzimos com escala para caber na caixa.
function fitPlayer(){
  const box=$('#lbM'), f=box.querySelector('iframe');
  if(!f)return;
  const small=window.innerWidth<760;
  box.classList.toggle('scaled',small);
  f.style.transform=small?`scale(${box.clientWidth/(box.classList.contains('wide')?960:540)})`:'';
}
window.addEventListener('resize',fitPlayer);
function closeLb(){$('#lb').classList.remove('open');$('#lbM').innerHTML='';document.body.style.overflow=''}
const step=d=>{if(cur<0)return;openLb((cur+d+visiveis.length)%visiveis.length)};
$('#lbX').onclick=closeLb;$('#lbP').onclick=()=>step(-1);$('#lbN').onclick=()=>step(1);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight'&&!irSlide(1))step(1);if(e.key==='ArrowLeft'&&!irSlide(-1))step(-1)});

if(nCarr)$('#tCarr').hidden=false;
if(EDICAO)$('#lblMes').textContent='Edição';
if(REG){const l=$('#fCli').closest('.row').querySelector('.lbl');if(l)l.textContent='Região'}
else if(DATA.rotulo_clientes){const l=$('#fCli').closest('.row').querySelector('.lbl');if(l)l.textContent=DATA.rotulo_clientes}
if(DATA.clientes.length<2){$('#fCli').closest('.row').hidden=true;document.body.classList.add('uni')}
readHash();update();
</script>
</body>
