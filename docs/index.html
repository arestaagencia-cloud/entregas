<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#040404">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>HUB de Entregas · ArestAgência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#040404;--ink:#F8F4F2;--ink-2:#b9b1ad;--muted:#8f8784;--line:#232323;--card:#0f0f0f;--card-2:#151515;--gold:#F6AD03;
    --sans:"Inter Tight",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
  button,.btn-pri,.btn-sec,.btn-gold{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s}
  button:active:not(:disabled),.btn-pri:active,.btn-sec:active{transform:scale(.97)}
  select option{background:#141414;color:var(--ink)}
  html{scroll-behavior:smooth;scroll-padding-top:70px}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:inherit;text-decoration:none}
  input,button,select{font:inherit;color:inherit;background:none;border:0}
  button{cursor:pointer}
  [hidden]{display:none!important}
  .wrap{max-width:1280px;margin:0 auto;padding:0 clamp(18px,3.2vw,40px)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* topo */
  header.top{position:sticky;top:0;z-index:30;background:rgba(4,4,4,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-g{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;padding-top:14px;padding-bottom:14px}
  .t-esq{display:flex;align-items:center;gap:14px;min-width:0}
  .t-esq .sync{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-dir{display:flex;align-items:center;justify-content:flex-end;gap:28px}
  .eyeb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  .brand img{width:56px;height:56px;object-fit:contain}
  .brand span{font-size:13px;letter-spacing:.32em;font-weight:600}
  .top-g .brand{flex-direction:row;gap:12px}
  .top-g .brand img{width:34px;height:34px}
  .acoes-top{display:flex;justify-content:flex-end;align-items:center;gap:14px;flex-wrap:wrap}
  .sync{font-size:13px;color:var(--muted)}
  .sync.rodando{color:var(--gold)}
  .btn-gold{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid #2e2e2e;color:var(--ink-2);font-size:13px;font-weight:500}
  .btn-gold:hover{border-color:#555;color:var(--ink)}
  .btn-gold.girando{border-color:var(--gold);color:var(--gold)}
  .btn-gold:disabled{opacity:.55;cursor:default}
  .btn-gold svg{width:16px;height:16px}
  .btn-gold.girando svg{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .pf{position:relative}
  .perfil{width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid #3a3a3a;background:#1d1a14;color:var(--gold);font-weight:600;display:flex;align-items:center;justify-content:center;font-size:15px}
  .perfil:hover{border-color:var(--gold)}
  .perfil img{width:100%;height:100%;object-fit:cover}
  .menu-pf{position:absolute;right:0;top:calc(100% + 10px);z-index:40;min-width:240px;background:#141414;border:1px solid #2e2e2e;border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6);text-align:left}
  .mp-h{padding:10px 10px 12px;border-bottom:1px solid #262626;margin-bottom:6px;display:flex;flex-direction:column;gap:2px}
  .mp-h b{font-size:14px;font-weight:600}.mp-h span{font-size:12px;color:var(--muted);word-break:break-all}
  .menu-pf button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:7px;font-size:14px;color:var(--ink-2)}
  .menu-pf button:hover{background:#222;color:var(--ink)}
  nav.secoes{display:flex;gap:26px;font-size:14px}
  nav.secoes a{color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
  nav.secoes a.on{color:var(--ink);border-bottom-color:var(--gold)}
  nav.secoes a:hover{color:var(--ink)}

  /* seções */
  section.sec{border-top:1px solid var(--line);scroll-margin-top:70px}
  section.sec:first-of-type{border-top:0}
  section.sec.alt{background:#080808}
  .sec-in{padding-top:72px;padding-bottom:84px}
  .kick{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  h2.tit{margin:10px 0 0;font-weight:700;font-size:clamp(28px,3.2vw,38px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
  .sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:32px}
  .nota{font-size:13px;color:var(--muted)}

  /* painéis */
  .busca{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px}
  .busca:focus-within{border-color:#4a4440}
  .busca input{outline:none;color:var(--ink);width:200px}
  .busca svg{width:16px;height:16px;flex:none}
  .cols{display:flex;flex-wrap:wrap;gap:32px}
  .col{flex:1 1 520px;min-width:0}
  .col-h{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid #3a3a3a}
  .col-h.free{border-bottom-color:var(--muted)}
  .col-h i{width:10px;height:10px;border-radius:50%;background:var(--ink)}
  .col-h.free i{background:none;border:2px solid #c9c3bf}
  .col-h h3{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .col-h span{margin-left:auto;font-size:13px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .card{display:flex;flex-direction:column;background:#14100a;border:1px solid #3a2e14;border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s}
  .card.free{background:var(--card);border-color:#262626}
  .card:hover{transform:translateY(-3px);border-color:#6b5420}
  .card.free:hover{border-color:#444}
  .cv{position:relative;display:block;aspect-ratio:16/9;background:#1f180b;overflow:hidden}
  .card.free .cv{background:#181818}
  .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92;transition:transform .4s}
  .card:hover .cv img{transform:scale(1.03)}
  .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72))}
  .cv .mos{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:3px;transition:transform .4s}
  .card:hover .cv .mos{transform:scale(1.03)}
  .cv .mos i{background:#1f180b center/cover no-repeat}
  .cb{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cb .nm{font-size:16px;font-weight:600}
  .cb .rs{font-size:13px;color:#a0968f}
  .cf{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;row-gap:6px;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .cf .um{color:#a0968f;white-space:nowrap}
  .cf .ab,.cf .ab a,.cf .cp{white-space:nowrap}
  .cf .ab{display:flex;align-items:center;gap:12px}
  .cf .ab a{color:var(--ink);font-weight:600}
  .card.free .cf .ab a{color:var(--ink)}
  .cf .cp{color:var(--muted);font-size:12px}
  .cf .cp:hover{color:var(--ink)}
  .vazio{padding:40px 0;color:var(--muted);font-size:14px}

  /* abertura */
  .hero{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;justify-content:center;text-align:center;overflow:hidden}
  .mosaic{position:absolute;inset:-60px -20px;display:flex;gap:6px}
  .mcol{flex:1;display:flex;flex-direction:column;gap:6px;animation:drift 70s ease-in-out infinite alternate}
  .mcol:nth-child(even){animation-direction:alternate-reverse;margin-top:-70px}
  .mtile{width:100%;aspect-ratio:9/16;border-radius:4px;background:#1a160f center/cover no-repeat;flex:none}
  .mtile.h{aspect-ratio:4/5}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-160px)}}
  @media (prefers-reduced-motion:reduce){.mcol{animation:none}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,4,.8) 0%,rgba(4,4,4,.5) 30%,rgba(4,4,4,.7) 62%,#040404 100%)}
  .hero-in{position:relative;z-index:2;padding:0 24px clamp(48px,9vh,96px);max-width:900px}
  .hero-in .kick{color:var(--ink-2)}
  .hero h1{font-weight:700;font-size:clamp(34px,5.6vw,80px);line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin-top:14px}
  .hero h2{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--gold);font-size:clamp(28px,4vw,48px);margin-top:10px}
  .hero p{margin-top:18px;color:var(--ink-2);font-size:clamp(15px,1.5vw,18px)}
  .hero{min-height:min(80vh,800px)}
  .hero-in{padding-top:clamp(180px,34vh,360px);padding-bottom:clamp(36px,6vh,64px)}
  .hero.parado .mcol,.hero:hover .mcol{animation-play-state:paused}
  .hstats{display:flex;justify-content:center;gap:clamp(24px,5vw,56px);margin-top:clamp(20px,3.5vh,32px)}
  .hs{display:flex;flex-direction:column;align-items:center;gap:4px}
  .hs b{font-family:var(--mono);font-weight:500;font-size:clamp(20px,2.2vw,26px);color:var(--ink)}

  .hs span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .hmix{width:min(320px,76vw);margin:18px auto 0;font-size:11px;display:flex;flex-direction:column;gap:10px}
  .hmix .mix{height:4px}
  .hmix .leg{font-size:11px}
  .hmix .leg{justify-content:center}
  .hmix .leg b{font-family:var(--mono);font-weight:500;color:var(--ink);display:inline-block}
  .pulso{animation:pulso 1.2s ease}
  /* upload */
  .up-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:stretch}
  .up-f{min-width:0;display:flex;flex-direction:column;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .up-f .drop{flex:1 0 auto}
  .cal{align-self:stretch}
  .sub{font-size:15px;font-weight:600;line-height:36px}
  @media (max-width:1000px){.up-g{grid-template-columns:1fr}}
  .campos{display:grid;grid-template-columns:1fr;gap:12px}
  .campos label{min-width:0;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
  .campos select{width:100%;min-width:0;text-overflow:ellipsis;height:48px;background:#0f0f0f;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 14px;font-size:15px;appearance:auto}
  .cmp{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);min-width:0}
  .cmp label{cursor:pointer}
  .combo{position:relative}
  .combo input{width:100%;height:48px;background:#0f0f0f;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 40px 0 14px;font-size:15px;text-overflow:ellipsis}
  .combo::after{content:"";position:absolute;right:16px;top:20px;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
  .combo input:focus{outline:none;border-color:var(--gold)}
  .cb-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:300px;overflow:auto;background:#141414;border:1px solid #2e2e2e;border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.6)}
  .combo.aberto .cb-list{display:block}
  .cb-o{padding:9px 10px;border-radius:7px;font-size:14px;color:var(--ink-2);cursor:pointer}
  .cb-o.on{background:#242019;color:var(--ink)}
  .cb-o.sel{color:var(--gold)}
  .cb-o.novo{color:var(--ink);font-weight:600;border-top:1px solid #262626;border-radius:0 0 7px 7px}
  .cb-o.novo+.cb-o.novo{border-top:0}
  .cb-vz{padding:10px;font-size:13px;color:var(--muted)}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:180px;border:1.5px dashed #4a4440;border-radius:16px;background:#0a0a0a;text-align:center;padding:32px}
  .drop svg{width:40px;height:40px}
  .drop .gr{font-size:20px;font-weight:600;line-height:1.2}
  .drop .pq{font-size:14px;color:var(--muted);max-width:520px}
  .pasta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .pasta code{font-family:var(--mono);font-size:14px;background:#151515;border:1px solid #2c2c2c;border-radius:8px;padding:8px 12px;color:var(--ink)}
  .pasta button{font-size:13px;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
  .btn-pri{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 28px;border-radius:999px;background:var(--gold);color:#040404;font-size:15px;font-weight:700}
  .btn-pri:hover{background:#ffc93d}
  .conta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
  .conta .ok{display:inline-flex;align-items:center;gap:8px}
  .conta .ok i{width:8px;height:8px;border-radius:50%;background:#4fbf73}
  .btn-sec{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px;border-radius:999px;border:1px solid #3a3a3a;color:var(--ink);font-size:14px;font-weight:600;background:#111}
  .btn-sec:hover{border-color:#666}
  .lnk{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .lnk:hover{color:var(--ink)}
  .pend{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pend.tem{color:var(--gold)}
  .pend:empty{display:none}
  .drop.on{border-color:var(--gold);background:#141008}
  .fila{display:flex;flex-direction:column;gap:14px}
  .lote{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .lote .bl{width:100%}
  .lote label,.arq label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .fila input[type=text],.fila input[type=number],.fila select{height:38px;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:0 10px;font-size:14px;min-width:0}
  .fila input:focus,.fila select:focus{outline:none;border-color:var(--gold)}
  .fila input.vazio{border-color:#7a3b2a}
  .fl{display:flex;flex-direction:column;gap:10px}
  .arq{display:grid;grid-template-columns:44px minmax(0,1fr) 28px;gap:12px;align-items:start;background:#0d0d0d;border:1px solid var(--line);border-radius:12px;padding:12px}
  .arq .ic{width:44px;height:44px;border-radius:8px;background:#1a1a1a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .arq .cp2{display:flex;flex-wrap:wrap;gap:8px}
  .arq .cp2 .t{flex:2 1 220px}.arq .cp2 .c{flex:1 1 150px}.arq .cp2 .v{flex:0 0 70px}
  .arq .orig{font-size:12px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arq .fin{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all}
  .arq .fin.err{color:#e0805f}
  .arq .x{color:var(--muted);font-size:20px;line-height:1}
  .arq .x:hover{color:#fff}
  .arq .pg{margin-top:8px;height:4px;border-radius:999px;background:#222;overflow:hidden}
  .arq .pg i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  .arq.feito{opacity:.6}.arq.feito .pg i{background:#4fbf73}
  .arq.erro .pg i{background:#e0805f}
  .subs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;font-size:12px;color:var(--ink-2)}
  .subs span{flex-basis:100%;color:var(--gold)}
  .arq label.mk{flex-direction:row;align-items:center;gap:8px;font-size:12px;letter-spacing:0;color:var(--ink-2);cursor:pointer}
  .arq label.mk input{accent-color:var(--gold)}
  .subs b{font-weight:600}
  .subs.ok{color:#4fbf73}
  .fila-f{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .fila-f .ab2{display:flex;align-items:center;gap:18px}
  .btn-pri:disabled{opacity:.45;cursor:not-allowed}

  /* métricas */
  .prod{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px 24px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:32px}
  .prod-h{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .prod-mix{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
  @media (max-width:900px){.prod{grid-template-columns:1fr}}
  .bl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  @media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:14px}
  .kpi b{display:block;margin-top:6px;font-family:var(--mono);font-size:24px;font-weight:500}
  .mix{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px}
  .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
  .leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

  /* calendário */
  .cal{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .cal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .cal-h h3{font-size:15px;font-weight:600}
  .dow,.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .dow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .dia{min-height:74px;border-radius:8px;padding:7px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:#0d0d0d;border:1px solid #1d1d1d}
  .dia.vz{background:transparent;border-color:transparent}
  .dia.hoje{background:#1a1407;border-color:var(--gold)}
  .dia .n{font-size:13px}
  .dia.hoje .n{color:var(--gold)}
  .dia .ev{display:flex;flex-direction:column;gap:2px}
  .dia .ev a{font-size:11px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:.02em}
  .dia .ev a:hover{text-decoration:underline}
  .dia .ev a{display:flex;align-items:center;gap:4px}
  .dia .ev .et{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .dia .ev .pt{width:8px;height:8px;border-radius:50%;flex:none}
  .dia .ev .qt{color:var(--muted);font-weight:500}
  .dia.tem{cursor:pointer}.dia.tem:hover{border-color:#3a3a3a}
  .dia.sel{border-color:var(--ink)}
  .cal-leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:12px;color:var(--ink-2)}
  .cal-leg span{display:inline-flex;align-items:center;gap:6px}.cal-leg i{width:8px;height:8px;border-radius:50%}
  .cal-dia{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .cal-dia h4{font-size:13px;font-weight:600}
  .cal-dia a{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
  .cal-dia a:hover{color:var(--ink)}
  .cal-dia a i{width:8px;height:8px;border-radius:50%;flex:none}
  .cal-dia a small{color:var(--muted);margin-left:auto;font-size:12px}
  .avs{display:flex;flex:none}
  .av{width:16px;height:16px;border-radius:50%;object-fit:cover;border:1px solid #0d0d0d;background:#3a3020;color:var(--gold);font-style:normal;font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .avs .av+.av{margin-left:-5px}
  .kpi b.pulso{animation:pulso 1.2s ease}
  @keyframes pulso{0%{transform:scale(1)}30%{transform:scale(1.12);color:#fff}100%{transform:scale(1)}}
  .nav-m{display:flex;gap:8px}
  .nav-m button{width:36px;height:36px;border-radius:999px;border:1px solid var(--line)}
  .nav-m button:hover{border-color:#4a4440}
  .nav-m button:disabled{opacity:.3;cursor:default}

  footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;font-size:13px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%)}

  /* senha */
  .gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate form{width:100%;max-width:360px;text-align:center}
  .gate h2{font-weight:700;font-size:30px;letter-spacing:-.01em;margin:18px 0 6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .gate input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;font-size:16px;text-align:center}
  .gate input:focus{outline:none;border-color:var(--gold)}
  .gate label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0}
  .gate button{width:100%;background:var(--ink);color:#0b0b0b;border-radius:999px;padding:12px;font-weight:600}
  .gate .g-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f}
  .gate .g-alt{width:auto;background:none;color:var(--muted);padding:0;margin-top:6px;font-weight:400}
  .gate .lnk{text-decoration:underline;text-underline-offset:3px;font-size:13px}
  .gate .gmsg{color:var(--gold);font-size:14px;margin:-12px 0 20px}
  .gate .gmsg:empty{display:none}
  .gate #porSenha{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .gate #porSenha[hidden]{display:none}
  .gate .g-alt{margin-top:16px!important}
  .gate .erro{color:#ff8b7b;font-size:13px;min-height:20px;margin-top:10px}

  @media (max-width:760px){
    .top-g{grid-template-columns:auto 1fr auto;gap:12px}
    .t-esq .sync,.btn-gold span,.top-g .brand span{display:none}
    .btn-gold{padding:0 12px}
    .top-g .brand{justify-content:center}
    .t-dir{gap:14px}
    .acoes-top{justify-content:center}
    nav.secoes{gap:14px}
    .dia{min-height:64px;padding:6px}
    nav.secoes a{padding:12px 0}
    .nav-m button{width:44px;height:44px}
    .dia .ev .et{display:none}
      .busca input{width:140px}
  }
</style>
</head>

let D=null,P=[];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MC=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const curto=ym=>{const[a,m]=ym.split('-');return `${MC[+m-1]}.${a.slice(2)}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pl=(n,a,b)=>`${n.toLocaleString('pt-BR')} ${n===1?a:b}`;
const img=x=>!x?'':x.includes('/')?x:`https://drive.google.com/thumbnail?id=${x}&sz=w640`;
let MINI=new Set();  // miniaturas já servidas pelo próprio site (docs/m)
const mini=id=>MINI.has(id)?`/m/${id}.jpg`:`https://drive.google.com/thumbnail?id=${id}&sz=w240`;
const hoje=new Date(),YM=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function resumoTxt(p){return [[p.videos,'vídeo','vídeos'],[p.fotos,'foto','fotos'],[p.carrosseis,'carrossel','carrosséis']].filter(([n])=>n).map(([n,a,b])=>pl(n,a,b)).join(' · ')}

// ---------- 01 · painéis ----------
function renderPaineis(){
  const q=nrm($('#busca').value.trim());
  const l=P.filter(p=>!q||nrm(p.nome).includes(q)||(p.grupos||[]).some(g=>g.itens.some(m=>nrm(m.nome).includes(q))))
    .sort((a,b)=>b.ultimo.localeCompare(a.ultimo)||b.total-a.total);
  $('#cols').innerHTML=[['recorrente','Recorrentes',''],['freelancer','Freelancers','free']].map(([t,h,c])=>{
    const la=l.filter(p=>p.tipo===t);
    return `<div class="col"><div class="col-h ${c}"><i></i><h3>${h}</h3><span>${pl(la.length,'painel','painéis')}</span></div>
      ${la.length?`<div class="cards">${la.map(card).join('')}</div>`:'<div class="vazio">Nenhum painel encontrado.</div>'}</div>`}).join('');
}
function card(p){
  const fr=p.tipo==='freelancer';
  const mos=!fr&&!p.capa&&(p.capas||[]).length;  // recorrentes: o mesmo mosaico da capa do painel
  const capa=mos?`<span class="mos">${p.capas.slice(0,8).map(id=>`<i style="background-image:url('${mini(id)}')"></i>`).join('')}</span>`
    :(p.img?`<img src="${p.imgLocal?`/m/c/${p.img}.jpg`:img(p.img)}" alt="" loading="lazy" onerror="this.remove()">`:'');
  return `<article class="card${fr?' free':''}">
    <a class="cv" href="${p.url}" target="_blank" rel="noopener" aria-label="Abrir painel ${esc(p.nome)}">${capa}</a>
    <div class="cb"><div class="nm">${esc(p.nome)}</div><div class="rs">${resumoTxt(p)}</div>
      <div class="cf"><span class="um">Último mês: ${curto(p.ultimo)}</span>
        <span class="ab"><button type="button" class="cp" data-copiar="${p.url}" title="Copiar link do painel">Copiar link</button><a href="${p.url}" target="_blank" rel="noopener">Abrir →</a></span></div>
    </div></article>`;
}

// ---------- campo com busca (digitar ou escolher) por cima de um <select> escondido ----------
function combo(id,extra){
  const sel=$('#'+id),box=sel.previousElementSibling,inp=box.querySelector('input'),lst=box.querySelector('.cb-list');let ativo=-1,vis=[];
  const rot=()=>{const o=sel.options[sel.selectedIndex];return o?o.textContent:''};
  const abre=f=>{const q=nrm(f||'').trim();
    vis=[...sel.options].filter(o=>!q||q.split(/\s+/).every(t=>nrm(o.textContent).includes(t)));
    if(extra&&(f||'').trim())vis=vis.concat(extra((f||'').trim(),vis).map(e=>({value:e.v,textContent:e.t,novo:1})));
    ativo=vis.findIndex(o=>o.value===sel.value);if(ativo<0&&vis.length)ativo=0;
    lst.innerHTML=vis.length?vis.map((o,i)=>`<div class="cb-o${i===ativo?' on':''}${o.value===sel.value?' sel':''}${o.novo?' novo':''}" id="${lst.id}-${i}" role="option" aria-selected="${i===ativo}" data-v="${esc(o.value)}">${esc(o.textContent)}</div>`).join('')
      :'<div class="cb-vz">Nada encontrado</div>';
    box.classList.add('aberto');inp.setAttribute('aria-expanded','true');const a=lst.querySelector('.on');if(a){a.scrollIntoView({block:'nearest'});inp.setAttribute('aria-activedescendant',a.id)}};
  const fecha=()=>{box.classList.remove('aberto');inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant');inp.value=rot()};
  const escolhe=v=>{if(typeof enviando!=='undefined'&&enviando){fecha();inp.blur();toast('Aguarde o envio terminar');return}if(v!=null&&v!==sel.value){if(![...sel.options].some(o=>o.value===v)){const e=vis.find(o=>o.value===v);if(e)sel.add(new Option(e.textContent,v))}sel.value=v;sel.dispatchEvent(new Event('change'))}fecha();inp.blur()};
  inp.addEventListener('focus',()=>{if(sel.disabled)return;inp.select();abre('')});
  inp.addEventListener('input',()=>abre(inp.value));
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!box.classList.contains('aberto'))abre('');
      ativo=Math.max(0,Math.min(vis.length-1,ativo+(e.key==='ArrowDown'?1:-1)));
      lst.querySelectorAll('.cb-o').forEach((el,i)=>{el.classList.toggle('on',i===ativo);el.setAttribute('aria-selected',String(i===ativo))});const o=lst.querySelector('.on');if(o){o.scrollIntoView({block:'nearest'});inp.setAttribute('aria-activedescendant',o.id)}}
    else if(e.key==='Enter'){e.preventDefault();if(vis[ativo])escolhe(vis[ativo].value)}
    else if(e.key==='Escape'){fecha();inp.blur()}});
  lst.addEventListener('mousedown',e=>{const o=e.target.closest('.cb-o');e.preventDefault();if(o)escolhe(o.dataset.v)});
  inp.addEventListener('blur',()=>setTimeout(fecha,120));
  sel.sync=()=>{inp.value=rot();inp.disabled=sel.disabled};sel.sync();
}

  UC=[];

    cl.forEach(c=>UC.push({p,c,rot:cl.length>1?`${p.nome} · ${c.nome}`:p.nome,meses:(p.pastas.meses||[]).filter(m=>m.cliente===c.nome)}));
  });

  opcoesCli(0);

    if(v.startsWith('novocli:')){const[,t,...n]=v.split(':');const nome=n.join(':').trim();
      const ja=UC.findIndex(u=>!u.indef&&nrm(u.c.nome)===nrm(nome));

// "+ Criar cliente" ao digitar um nome que não existe
function extraCli(q,vis){
  if(q.length<2||UC.some(u=>nrm(u.c.nome)===nrm(q)||nrm(u.rot)===nrm(q)))return[];
  const n=q.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim();if(!n)return[];
  return[{v:'novocli:r:'+n,t:`+ Criar cliente "${n}" em Recorrentes`},{v:'novocli:f:'+n,t:`+ Criar cliente "${n}" em Freelancers`}];

// "+ Criar pasta" ao digitar um mês (ex.: "dez", "dezembro 26", "jan 2027")
function extraMes(q){
  const u=UC[+$('#uCli').value];if(!u||u.indef)return[];
  const m=nrm(q).match(/^([a-zç]{3,})\.?\s*(\d{2}|\d{4})?$/);if(!m)return[];
  const mi=MESES.findIndex(x=>nrm(x).startsWith(m[1]));if(mi<0)return[];
  let ano=m[2]?(m[2].length===2?2000+ +m[2]:+m[2]):hoje.getFullYear();
  if(!m[2]&&mi<hoje.getMonth()-1)ano++;  // "jan" em novembro = janeiro do ano que vem
  const ym=`${ano}-${String(mi+1).padStart(2,'0')}`;
  if((u.ex||[]).some(x=>x.mes===ym)||[...$('#uMes').options].some(o=>o.value==='novo:'+ym))return[];
  return[{v:'novo:'+ym,t:`+ Criar pasta de ${MESES[mi]} ${ano}`}];
}
function mesesUpload(){
  const u=UC[+$('#uCli').value];if(!u)return;
  const ex=u.meses.slice().sort((a,b)=>b.mes.localeCompare(a.mes));
  const opts=D.indefinido?[{v:'indef',t:'Mês indefinido (organizar depois)'}]:[];
  u.ex=ex;
  if(!u.indef){
    // meses que ainda não têm pasta: do mês passado até 2 meses à frente
    const novos=[];for(let k=2;k>=-1;k--){const d=new Date(hoje.getFullYear(),hoje.getMonth()+k,1),ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if(!ex.some(m=>m.mes===ym))novos.push({v:'novo:'+ym,t:`${MESES[d.getMonth()]} ${d.getFullYear()} · + criar pasta`,ym})}
    const todos=novos.map(n=>({...n,ord:n.ym})).concat(ex.map((m,i)=>({v:'id:'+i,t:`${MESES[+m.mes.slice(5)-1]} ${m.mes.slice(0,4)} · ${m.nome}`,ord:m.mes})));
    todos.sort((a,b)=>b.ord.localeCompare(a.ord)).forEach(o=>opts.push(o));
  }
  const ant=$('#uMes').value;
  $('#uMes').innerHTML=opts.map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('');
  const atual=u.indef?'indef':(ex.findIndex(m=>m.mes===YM)>=0?'id:'+ex.findIndex(m=>m.mes===YM):'novo:'+YM);
  $('#uMes').value=(u===mesesUpload.u&&ant&&[...$('#uMes').options].some(o=>o.value===ant))?ant:atual;  // cliente escolhido: mês atual
  mesesUpload.u=u;

  renderDrop();

}

const MMAP=Object.fromEntries(MESES.map((m,i)=>[nrm(m),i+1]));
async function lerMeses(u){

function nomeSugerido(u,ym){
  const ref=u.ex[0];const [a,m]=ym.split('-');const mesTxt=`${MESES[+m-1]}.${a.slice(2)}`;
  let base=u.c.nome,num=null;
  if(ref){const mm=ref.nome.match(/^\s*(\d+)\s*[.\-]\s*(.*?)\s*-\s*[^-]*$/);
    if(mm){base=mm[2]||base;const nums=u.ex.map(x=>parseInt(x.nome)).filter(n=>!isNaN(n));
      // numeração pelo mês do ano (11. ... Novembro) ou sequencial (07. ...)
      const peloMes=u.ex.filter(x=>parseInt(x.nome)===+x.mes.slice(5)).length>=u.ex.length*.8;
      num=peloMes?+m:(nums.length?Math.max(...nums)+1:1);}}
  else num=1;
  const zero=!u.ex.length||u.ex.some(x=>/^\s*0\d/.test(x.nome));
  return `${num!=null?(zero?String(num).padStart(2,'0'):String(num))+'. ':''}${base} - ${mesTxt}`;
}
// ---------- upload direto para o Drive (login Google no navegador) ----------
const G={tok:null,exp:0,cli:null,pend:null};
const VID=/\.(mov|mp4|m4v|avi|mkv|webm|mxf)$/i, IMG=/\.(jpe?g|png|heic|heif|webp|tiff?|gif)$/i;
function carregarGIS(){return new Promise((ok,nok)=>{if(window.google&&google.accounts)return ok();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=ok;sc.onerror=nok;document.head.appendChild(sc)})}
function pedirToken(prompt){
  return new Promise(async(ok,nok)=>{
    try{await carregarGIS()}catch(e){return nok(new Error('Não consegui carregar o login do Google.'))}
    if(!G.cli)G.cli=google.accounts.oauth2.initTokenClient({client_id:PUB.google,scope:'https://www.googleapis.com/auth/drive',
      callback:r=>{const p=G.pend;G.pend=null;if(!p)return;if(r.error)return p.nok(new Error(r.error));
        G.tok=r.access_token;G.exp=Date.now()+(r.expires_in-120)*1000;contaUI();p.ok(G.tok);setTimeout(()=>{if(typeof P!=='undefined'&&P.length){carregarAutores(calYM);quemSouEu();clientesDoDrive();const u=UC[+$('#uCli').value];u&&lerMeses(u)}},300)},
      error_callback:e=>{const p=G.pend;G.pend=null;p&&p.nok(new Error(e.type||'login cancelado'))}});
    G.pend={ok,nok};G.cli.requestAccessToken({prompt:prompt??''});
  });
}
const logado=()=>G.tok&&Date.now()<G.exp;
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${G.tok}`,...(opt.headers||{})}});
  if(r.status===401){G.tok=null;contaUI();throw Object.assign(new Error('Sessão do Google expirou'),{auth:true})}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||('Erro '+r.status))}
  return r;
}
const DRV='https://www.googleapis.com/drive/v3/files', qs=o=>new URLSearchParams({supportsAllDrives:'true',includeItemsFromAllDrives:'true',...o});
async function listar(q,campos='files(id,name,mimeType)'){
  let out=[],pt='';
  do{const r=await(await api(`${DRV}?${qs({q,fields:'nextPageToken,'+campos,pageSize:'1000',...(pt?{pageToken:pt}:{})})}`)).json();
    out=out.concat(r.files||[]);pt=r.nextPageToken||''}while(pt);
  return out;
}

function addArquivos(lista){
  if(!logado()){toast('Entre com Google para enviar');return}
  const a0=alvo();if(a0.id&&!a0.indef)arquivosDaPasta(a0.id).then(()=>renderFila());
  [...lista].forEach(f=>{

    const base=f.name.replace(/\.[^.]+$/,'').trim(),mv=[...base.matchAll(new RegExp(RXV.source,'gi'))].pop();
    const vOrig=mv?parseInt(mv[0].replace(/^\D+/,''))||1:1;  // "… - V.3" no arquivo original continua V.3
    let t=(mv?base.slice(0,mv.index)+base.slice(mv.index+mv[0].length):base).replace(/^[FPQ](\.\s*|\s+-\s*)/,'').trim();
    if(foto&&/^(IMG|DSC|DSCF|FX|_MG|P\d|DJI|GOPR|MVI|C\d{4})[_\-]?\d+/i.test(t))t='';  // nome de câmera não vira título
    FILA.push({f,video,foto,ext,outro:!video&&!foto,t,cat:'',pes:'',v:vOrig,vManual:!!mv,st:'',p:0,url:video||foto?'':null});
  });

function nomeFinal(x,u,idx){
  if(x.so)return x.f.name;  // .zip, outros e pasta Indefinido: nome original
  const N=u.p.nomes||{};const t=(x.t||'').trim().replace(/[\\/:*?"<>|]/g,'');if(!t)return '';
  const pre=N.cat?(x.cat||''):u.c.nome;if(N.cat&&!pre)return '';
  const p1=w=>nrm(w).split(/[^a-z0-9]+/).filter(Boolean)[0];
  let n=!N.cat&&p1(t)===p1(u.c.nome)?`F. ${t}`:`F. ${pre} - ${t}`;  // título já começa pelo cliente ("Sarau Junho…", "Niso - …"): não repete
  if(x.foto&&idx)n+=` ${idx}`;
  if(N.pes&&x.pes)n+=` - ${x.pes}`;
  if(x.video)n+=` - V.${Math.max(1,+x.v||1)}`;
  return n+x.ext.toLowerCase();
}
function nomesFila(){  // fotos com o mesmo título ganham número (1, 2, 3...)
  const u=UC[+$('#uCli').value];FILA.forEach(x=>x.so=x.outro||!!u.indef);const grupos={};
  FILA.forEach(x=>{if(x.foto){const k=[x.t.trim(),x.cat,x.pes].join('|');(grupos[k]=grupos[k]||[]).push(x)}});
  FILA.forEach(x=>{const g=x.foto?grupos[[x.t.trim(),x.cat,x.pes].join('|')]:null;
    x.nome=nomeFinal(x,u,g&&g.length>1?g.indexOf(x)+1:0)});
  const vistos={};FILA.forEach(x=>{x.dup=!!x.nome&&!!vistos[x.nome];if(x.nome)vistos[x.nome]=1});
}
function opcoes(lista,sel,vazio){return `<option value="">${vazio}</option>`+lista.map(o=>`<option value="${esc(o.v)}"${o.v===sel?' selected':''}>${esc(o.r)}</option>`).join('')}
// ---------- versões: "F. X - Título - V.2" substitui "F. X - Título - V.1" na mesma pasta ----------
const RXV=/[\s.\-]+v\.?\s?\d+(?:\.\d+)?(?:\(\d+\))?\s*(?=$|\s-\s[^-]+$)/i;
function semVersao(n,cli){n=String(n||'').normalize('NFC').replace(/\.[a-z0-9]{2,4}$/i,'');const m=[...n.matchAll(new RegExp(RXV.source,'gi'))].pop();
  if(m)n=n.slice(0,m.index)+n.slice(m.index+m[0].length);
  const fora=new Set(nrm(cli||'').split(/[^a-z0-9]+/).filter(w=>w.length>2));  // "Niso" e "Niso Engenharia" contam igual
  return nrm(n).replace(/[^a-z0-9]+/g,' ').trim().replace(/^f /,'').split(' ').filter(w=>!fora.has(w)).join(' ')}
const NOPASTA={};  // id da pasta -> [{id,name}]
async function arquivosDaPasta(id,forcar){
  if(!id||!logado())return null;if(NOPASTA[id]&&!forcar)return NOPASTA[id];
  try{NOPASTA[id]=await listarFundo(id)}catch(e){return null}
  return NOPASTA[id];
}
async function listarFundo(id,nivel=0){  // arquivos da pasta e das subpastas (até 3 níveis), com a pasta de cada um
  const fs=await listar(`'${id}' in parents and trashed=false`,'files(id,name,mimeType,parents)');let out=[];
  for(const f of fs){if(f.mimeType==='application/vnd.google-apps.folder'){if(nivel<3)out=out.concat(await listarFundo(f.id,nivel+1))}else out.push(f)}
  return out;
}
function versoes(){  // marca em cada arquivo da lista as versões anteriores que ele substitui
  const a=alvo();const ex=a.indef?null:NOPASTA[a.id];
  FILA.forEach(x=>{x.subs=[];if(!ex||x.so||!x.nome||x.st==='feito')return;const cli=a.u.c.nome,b=semVersao(x.nome,cli);if(!b)return;
    const iguais=ex.filter(f=>semVersao(f.name,cli)===b);
    if(x.video&&!x.vManual&&iguais.length){  // já existe esse vídeo: sugere a próxima versão
      const nums=iguais.map(f=>{const m=[...f.name.replace(/\.[a-z0-9]{2,4}$/i,'').matchAll(new RegExp(RXV.source,'gi'))].pop();return m?parseInt(m[0].replace(/\D+/,''))||1:1});
      const prox=Math.max(...nums)+1;if(x.v!==prox){x.v=prox;nomesFila()}}
    x.subs=iguais.filter(f=>f.name.normalize('NFC')!==x.nome.normalize('NFC'))});
}
function renderFila(){
  if(!FILA.length){$('#fila').hidden=true;return}

async function pastaDestino(a){
  if(a.id)return a.id;
  if(!a.u.c.id){  // cliente novo: procura pelo nome (alguém pode ter criado) ou cria a pasta
    const pai=D.tipos[a.u.tipo];
    const fs=await listar(`'${pai}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const f=fs.find(x=>nrm(x.name.replace(/^\s*\d+\s*[.\-]\s*/,''))===nrm(a.u.c.nome));
    if(f)a.u.c.id=f.id;
    else{const r=await(await api(`${DRV}?${qs({fields:'id'})}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:a.u.c.nome,mimeType:'application/vnd.google-apps.folder',parents:[pai]})})).json();a.u.c.id=r.id;toast('Cliente criado: '+a.u.c.nome)}
  }
  const esc2=t=>t.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const [y,m]=a.ym.split('-');const mesTxt=`${MESES[+m-1]}.${y.slice(2)}`;
  const ex=await listar(`'${a.u.c.id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const achou=ex.find(f=>f.name.trim()===a.nome)||ex.find(f=>f.name.normalize('NFC').toLowerCase().includes(mesTxt.toLowerCase()));
  if(achou)return achou.id;  // alguém já criou a pasta do mês depois da última leitura do robô
  const r=await(await api(`${DRV}?${qs({fields:'id'})}`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:a.nome,mimeType:'application/vnd.google-apps.folder',parents:[a.u.c.id]})})).json();
  toast('Pasta criada: '+a.nome);return r.id;
}
function putChunk(url,blob,ini,total,onp){
  return new Promise((ok,nok)=>{const x=new XMLHttpRequest();x.open('PUT',url);
    x.setRequestHeader('Content-Range',`bytes ${ini}-${ini+blob.size-1}/${total}`);
    x.upload.onprogress=e=>onp(ini+e.loaded);
    x.onload=()=>ok(x);x.onerror=()=>nok(new Error('rede'));x.send(blob)});
}
function statusUpload(url,total){
  return new Promise((ok,nok)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Range',`bytes */${total}`);
    x.onload=()=>ok(x);x.onerror=()=>nok(new Error('rede'));x.send()});
}
async function subir(x,pasta){
  const f=x.f,CH=16*1024*1024;
  const r=await api(`https://www.googleapis.com/upload/drive/v3/files?${qs({uploadType:'resumable',fields:'id'})}`,{method:'POST',
    headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':f.type||'application/octet-stream','X-Upload-Content-Length':String(f.size)},
    body:JSON.stringify({name:x.nome,parents:[pasta]})});
  const url=r.headers.get('Location');if(!url)throw new Error('O Google não abriu o envio.');
  let ini=0,falhas=0;
  const pinta=n=>{x.p=Math.min(99,Math.round(n/f.size*100));const el=document.querySelector(`#fl .arq[data-i="${FILA.indexOf(x)}"] .pg i`);if(el)el.style.width=x.p+'%'};
  while(true){
    try{
      const res=f.size?await putChunk(url,f.slice(ini,ini+CH),ini,f.size,pinta):await statusUpload(url,0);
      if(res.status===200||res.status===201)return;
      if(res.status===308){const rg=res.getResponseHeader('Range');ini=rg?+rg.split('-')[1]+1:Math.min(f.size,ini+CH);falhas=0;pinta(ini);continue}
      if(res.status===404||res.status===410)throw Object.assign(new Error('O envio expirou. Tente de novo.'),{fatal:true});
      throw new Error('Erro '+res.status);
    }catch(e){
      if(e.fatal||++falhas>6)throw e;
      await new Promise(s=>setTimeout(s,Math.min(30000,1000*2**falhas)));
      try{const st=await statusUpload(url,f.size);if(st.status===200||st.status===201)return;
        if(st.status===308){const rg=st.getResponseHeader('Range');ini=rg?+rg.split('-')[1]+1:0}}catch(_){}
    }
  }
}

    renderFila();
  }

  if(ok&&!erro&&a.indef){toast(`${ok} ${ok===1?'arquivo enviado':'arquivos enviados'} para a pasta Indefinido. Organize depois.`);renderDrop()}
  else if(ok&&!erro&&!a.u.p.url){toast(`${ok} ${ok===1?'arquivo enviado':'arquivos enviados'}. Este cliente ainda não tem painel.`);a.u.lido=false;mesesUpload()}
  else if(ok&&!erro){toast(`${ok} ${ok===1?'arquivo enviado':'arquivos enviados'}. Atualizando o sistema…`);
    setTimeout(()=>refresh(),1500)}
  else if(ok)toast(`${ok} enviados, ${erro} com erro. Tente de novo os que falharam.`);
  else toast('Nenhum arquivo foi enviado.');
};

// ---------- atualizar sistema (GitHub Actions) ----------
const API=()=>`https://api.github.com/repos/${D.gh.repo}/actions/workflows/${D.gh.workflow}/runs?per_page=1`;
function haQuanto(t){const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.round(m/60);return h<24?`há ${h} h`:`há ${Math.round(h/24)} d`}
let rodando=false;
async function status(){
  try{const r=await fetch(API(),{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw 0;
    const run=(await r.json()).workflow_runs[0];if(!run)return null;
    const em=run.status!=='completed';
    $('#sync').textContent=em?'Atualizando o sistema…':`Sincronizado ${haQuanto(run.updated_at)}`;
    $('#sync').classList.toggle('rodando',em);
    return run;
  }catch(e){return null}
}
async function refresh(){
  if(rodando)return;
  if(!D.gh.token){window.open(`https://github.com/${D.gh.repo}/actions/workflows/${D.gh.workflow}`,'_blank','noopener');
    toast('No GitHub, clique em "Run workflow"');return}
  const b=$('#refresh');rodando=true;b.disabled=true;b.classList.add('girando');b.querySelector('span').textContent='Atualizando…';
  const ini=Date.now();
  try{
    const r=await fetch(`https://api.github.com/repos/${D.gh.repo}/actions/workflows/${D.gh.workflow}/dispatches`,{method:'POST',
      headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${D.gh.token}`},body:JSON.stringify({ref:'main'})});
    if(r.status!==204)throw new Error(r.status);
    toast('Lendo o Drive. Leva uns 2 a 3 minutos.');
    let fim=null;
    for(let i=0;i<60&&!fim;i++){await new Promise(s=>setTimeout(s,8000));const run=await status();
      if(run&&new Date(run.created_at)>=ini-60000&&run.status==='completed')fim=run}
    if(fim&&fim.conclusion==='success'){$('#sync').textContent='Publicando a nova versão…';toast('Pronto. A página recarrega em 1 minuto.');setTimeout(()=>location.reload(),60000)}
    else toast('Não terminou como esperado. Veja o GitHub Actions.');
  }catch(e){toast('Não consegui acionar o robô. Abrindo o GitHub.');window.open(`https://github.com/${D.gh.repo}/actions/workflows/${D.gh.workflow}`,'_blank','noopener')}
  finally{rodando=false;b.disabled=false;b.classList.remove('girando');b.querySelector('span').textContent='Atualizar sistema'}
}
$('#refresh').onclick=refresh;

// ---------- navegação ----------
const links=[...document.querySelectorAll('nav.secoes a')];
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('section.sec,section.hero').forEach(s=>obs.observe(s));

// ---------- abertura: mosaico com um pouco das entregas de todos os clientes ----------
let obsHero=null;
function abertura(){
  if(!obsHero&&'IntersectionObserver' in window){obsHero=new IntersectionObserver(es=>es.forEach(e=>$('#inicio').classList.toggle('parado',!e.isIntersecting)));obsHero.observe($('#inicio'))}
  MINI=new Set(P.flatMap(p=>p.mini||[]));
  const temMini=P.some(p=>(p.mini||[]).length);const fila=P.map(p=>(temMini?(p.mini||[]):(p.capas||[])).slice());const ids=[];let k=0;
  while(fila.some(f=>f.length)){const f=fila[k++%fila.length];if(f.length)ids.push(f.shift())}  // intercala os clientes
  const cols=window.innerWidth<700?6:window.innerWidth<1100?10:14,m=$('#mosaic');m.innerHTML='';
  const total=Math.min(Math.max(ids.length,cols*6),cols*7);
  for(let c=0;c<cols;c++){const col=document.createElement('div');col.className='mcol';
    for(let i=c;i<total;i+=cols){const id=ids[i%ids.length];if(!id)continue;const t=document.createElement('div');t.className='mtile';
      t.style.backgroundImage=`url("${mini(id)}")`;col.appendChild(t)}
    m.appendChild(col)}
  const M=D.metricas,nc=P.length;
  
}
function iniciar(){
  P=D.paineis;UP=D.metricas.uploads||[];
  abertura();renderPaineis();iniciarUpload();renderMetricas();calendario();carregarAutores(calYM);
  status();setInterval(()=>{if(!rodando)status()},120000);
}

// ---------- senha: os dados só existem decifrados com ela ----------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CIFRA.sal),iterations:CIFRA.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CIFRA.iv)},chave,b64(CIFRA.ct));
  return JSON.parse(new TextDecoder().decode(txt));
}
// ---------- sessão: sempre com login Google; sem Google conectado, o HUB fecha ----------
// sessionStorage = só esta aba, some ao fechar. Guarda a chave e o token para sobreviver ao recarregar (ex.: Atualizar sistema).
const SESS={get(){try{return JSON.parse(sessionStorage.getItem('aresta-hub-s')||'null')}catch(e){return null}},
  set(v){try{v?sessionStorage.setItem('aresta-hub-s',JSON.stringify(v)):sessionStorage.removeItem('aresta-hub-s')}catch(e){}}};
try{localStorage.removeItem('aresta-hub')}catch(e){}  // senha lembrada da versão antiga: não vale mais
let INI=false,VIA=null,EXP_SENHA=0;
async function entrar(senha,via){
  const dados=await abrir(senha);
  if(!INI){D=dados;if(Array.isArray(D))D={paineis:D,metricas:{total:0,videos:0,fotos:0,carrosseis:0,paineis:D.length,meses:[],clientes:[],uploads:[]},gh:{repo:'arestaagencia-cloud/entregas',workflow:'atualizar-paineis.yml'}}}
  VIA=via;if(via==='senha'){EXP_SENHA=Date.now()+3600e3;G.tok=null}
  SESS.set({k:senha,via,tok:G.tok,exp:via==='senha'?EXP_SENHA:G.exp});
  $('#gate').hidden=true;$('#gMsg').textContent='';$('#perfil').hidden=false;
  if(!INI){INI=true;iniciar()}
  if(via==='google'){EU=null;await quemSouEu()}
  perfilUI();if(via==='google'){carregarAutores(calYM)}
}
function bloquear(msg){
  if(!INI)return;
  menuPf(false);$('#gate').hidden=false;$('#gMsg').textContent=msg||'';$('#erro').textContent='';
  window.scrollTo(0,0);
}
function sair(){
  const t=G.tok;G.tok=null;G.exp=0;EU=null;SESS.set(null);
  try{t&&google.accounts.oauth2.revoke(t,()=>{})}catch(e){}
  location.reload();
}
// vigia: token do Google vence em 1 h; sem ele o HUB fecha (só depois de terminar um envio em andamento)
setInterval(()=>{
  if(!INI||!$('#gate').hidden||(typeof enviando!=='undefined'&&enviando))return;
  if(VIA==='google'&&!logado())bloquear('Sua conexão com o Google terminou. Entre de novo para continuar.');
  if(VIA==='senha'&&Date.now()>EXP_SENHA)bloquear('A sessão com a senha de emergência terminou. Entre de novo.');
},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&INI&&VIA==='google'&&!logado()&&!(typeof enviando!=='undefined'&&enviando))bloquear('Sua conexão com o Google terminou. Entre de novo para continuar.')});

function perfilUI(){
  const b=$('#perfil'),m=$('#menuPerfil');
  if(VIA==='google'&&EU){
    b.innerHTML=EU.photoLink?`<img src="${esc(EU.photoLink)}" alt="" referrerpolicy="no-referrer">`:`<span>${esc((EU.displayName||EU.emailAddress||'?')[0].toUpperCase())}</span>`;

  }
}
function menuPf(abrir){$('#menuPerfil').hidden=!abrir;$('#perfil').setAttribute('aria-expanded',String(abrir));if(abrir)$('#mpTroca').focus()}
$('#perfil').onclick=e=>{e.stopPropagation();menuPf($('#menuPerfil').hidden)};

$('#mpTroca').onclick=async()=>{menuPf(false);
  if(typeof enviando!=='undefined'&&enviando){toast('Aguarde o envio terminar');return}

  try{await entrar($('#senha').value,'senha');$('#senha').value=''}catch(err){$('#erro').textContent='Senha incorreta.';$('#senha').select()}
});
// login Google: a chave do HUB fica num documento do Drive compartilhado só com a equipe
async function entrarGoogle(troca){
  $('#erro').textContent='';const b=$('#gGate');b.disabled=true;
  try{
    await pedirToken('select_account');
    const r=await fetch(`${DRV}/${PUB.chave}/export?mimeType=text/plain`,{headers:{Authorization:`Bearer ${G.tok}`}});
    if(r.status===403||r.status===404)throw new Error('sem acesso');
    if(!r.ok)throw new Error('erro '+r.status);
    const chave=(await r.text()).replace(/^﻿/,'').trim();
    try{await entrar(chave,'google')}catch(e){throw new Error('chave')}
    if(troca)toast('Conta trocada');
    return true;
  }catch(e){
    G.tok=null;
    $('#erro').textContent=e.message==='sem acesso'?'Este e-mail não tem acesso ao HUB. Peça para compartilharem a "Chave do Hub" com você.'
      :e.message==='chave'?'A "Chave do Hub" no Drive não confere com o HUB. Avise quem administra.'
      :'Login não concluído. Tente de novo ou use a senha de emergência.';
    return false;
  }finally{b.disabled=false}
}
if(PUB.google&&PUB.chave){
  $('#gGate').hidden=false;$('#mostraSenha').hidden=false;$('#porSenha').hidden=true;
  $('#gGate').onclick=()=>entrarGoogle(false);
  $('#mostraSenha').onclick=()=>{$('#porSenha').hidden=false;$('#mostraSenha').hidden=true;$('#senha').focus()};

}else{$('#senha').placeholder='Senha'}
// recarregou a aba dentro da hora: continua conectado
(()=>{const s=SESS.get();if(!s)return;
  if(s.via==='google'&&s.tok&&Date.now()<s.exp){G.tok=s.tok;G.exp=s.exp;entrar(s.k,'google').catch(()=>SESS.set(null))}
  else if(s.via==='senha'&&Date.now()<s.exp){entrar(s.k,'senha').then(()=>{EXP_SENHA=s.exp}).catch(()=>SESS.set(null))}
  else{SESS.set(null);$('#gMsg').textContent='Sua conexão com o Google terminou. Entre de novo para continuar.'}})();
</script>
