<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clientes · Painéis · ArestAgência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040404; --ink:#F8F4F2; --ink-2:#d9d2ce; --muted:#8f8784;
    --line:#232323; --card:#0f0f0f; --card-2:#161616; --accent-dark:#3c1e1e; --gold:#F6AD03;
    --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
    --serif:"Instrument Serif",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:inherit;text-decoration:none}
  input,button{font:inherit;color:inherit;background:none;border:0}
  .wrap{max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}

  header{padding:34px 0 0;display:flex;justify-content:center}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;object-fit:contain}
  .brand span{font-weight:700;letter-spacing:.14em;font-size:15px}

  .hero{text-align:center;padding:clamp(48px,9vh,96px) 0 clamp(28px,5vh,48px)}
  .eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,88px);line-height:1;margin:14px 0 10px}
  h1 em{color:var(--gold)}
  .sub{color:var(--ink-2);font-size:15px}
  .stats{display:flex;justify-content:center;gap:clamp(22px,5vw,64px);margin-top:34px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,48px);line-height:1}
  .stat span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  .tools{display:flex;gap:12px;align-items:center;margin:8px 0 22px;flex-wrap:wrap}
  .busca{flex:1;min-width:220px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px}
  .busca::placeholder{color:var(--muted)}
  .busca:focus{outline:none;border-color:#3a3a3a}
  .ord{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ord button{padding:11px 14px;font-size:14px;color:var(--ink-2);cursor:pointer}
  .ord button.on{background:var(--card-2);color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:#3a3a3a}
  .mos{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;aspect-ratio:16/9;background:#000;position:relative}
  .mos i{background:var(--accent-dark) center/cover no-repeat}
  .mos::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75))}
  .mos .nome{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;font-weight:700;font-size:24px;letter-spacing:.02em;line-height:1.05;text-transform:uppercase}
  .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .nums{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
  .nums b{color:#fff;font-weight:600}
  .meta{font-size:12.5px;color:var(--muted)}
  .meta .novo{color:var(--gold)}
  .marcas{display:flex;flex-wrap:wrap;gap:6px}
  .marcas a{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink-2)}
  .marcas a:hover{border-color:#444;color:#fff}
  .acoes{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .btn{flex:1;text-align:center;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:500}
  .btn.pri{background:var(--ink);color:#0b0b0b}
  .btn.sec{border:1px solid #333;color:#fff;cursor:pointer;flex:none}
  .vazio{padding:60px 0;text-align:center;color:var(--muted)}
  footer{margin:72px 0 40px;text-align:center;color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate form{width:100%;max-width:360px;text-align:center}
  .gate h2{font-family:var(--serif);font-weight:400;font-size:40px;margin:18px 0 6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .gate input[type=password]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;font-size:16px;text-align:center}
  .gate input:focus{outline:none;border-color:#444}
  .gate label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0}
  .gate button{width:100%;background:var(--ink);color:#0b0b0b;border-radius:999px;padding:12px;font-weight:600;cursor:pointer}
  .gate .erro{color:#ff8b7b;font-size:13px;min-height:20px;margin-top:10px}
  .sair{position:absolute;top:30px;right:clamp(18px,4vw,48px);font-size:13px;color:var(--muted);cursor:pointer}
  [hidden]{display:none!important}
  @media (max-width:600px){.grid{grid-template-columns:1fr}.mos .nome{font-size:21px}}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="fGate">
  <div class="brand" style="justify-content:center"><img src="data:image/png;base64,{{LOGO}}" alt=""><span>ARESTAGÊNCIA</span></div>
  <h2>Área da equipe</h2><p>Digite a senha para ver os painéis dos clientes.</p>
  <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" autofocus aria-label="Senha">
  <label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
  <button type="submit">Entrar</button><div class="erro" id="erro"></div>
</form></div>
<button class="sair" id="sair" hidden>Sair</button>
<header><div class="brand"><img src="data:image/png;base64,{{LOGO}}" alt=""><span>ARESTAGÊNCIA</span></div></header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Uso interno</div>
    <h1>Painéis dos <em>clientes</em></h1>
    <p class="sub">Todos os dashboards de entrega em um só lugar</p>
    <div class="stats" id="stats"></div>
  </section>

  <div class="tools">
    <input class="busca" id="busca" type="search" placeholder="Buscar cliente ou marca…" aria-label="Buscar cliente">
    <div class="ord" id="ord"><button data-o="recente" class="on">Mais recentes</button><button data-o="nome">A–Z</button><button data-o="volume">Mais conteúdos</button></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>Atualizado em {{ATUALIZADO}} · os painéis se atualizam sozinhos de hora em hora a partir do Google Drive</footer>
<div class="toast" id="toast">Link copiado</div>

<script>
const CIFRA = /*__DATA__*/null;
let P = [];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mes=ym=>{const[a,m]=ym.split('-');return `${MESES[+m-1]} ${a}`};
const thumb=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w360`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const hoje=new Date(), atual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;

let ordem='recente';
function render(){
  const q=$('#busca').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let l=P.filter(p=>!q||norm(p.nome).includes(q)||p.marcas.some(m=>norm(m.nome).includes(q)));
  l.sort(ordem==='nome'?(a,b)=>a.nome.localeCompare(b.nome):ordem==='volume'?(a,b)=>b.total-a.total:(a,b)=>b.ultimo.localeCompare(a.ultimo)||b.total-a.total);
  if(!l.length){$('#grid').innerHTML='<div class="vazio">Nenhum cliente encontrado.</div>';return}
  $('#grid').innerHTML=l.map(p=>{
    const nums=[[p.total,'conteúdos'],[p.videos,'vídeos'],[p.fotos,'fotos']].concat([[p.carrosseis,'carrosséis']]).filter(([n],k)=>k===0||n>0)
      .map(([n,t])=>`<span><b>${n}</b> ${t}</span>`).join('');
    const marcas=p.marcas.length>1?`<div class="marcas">${p.marcas.map(m=>`<a href="${p.url}#cliente=${encodeURIComponent(m.nome)}" title="${m.total} conteúdos">${esc(m.nome)}</a>`).join('')}</div>`:'';
    return `<article class="card">
      <a class="mos" href="${p.url}">${p.capas.map(id=>`<i style="background-image:url('${thumb(id)}')"></i>`).join('')}<span class="nome">${esc(p.nome)}</span></a>
      <div class="info">
        <div class="nums">${nums}</div>
        <div class="meta">${mes(p.primeiro)} a ${mes(p.ultimo)} · ${p.meses} ${p.meses>1?'meses':'mês'}${p.ultimo===atual?' · <span class="novo">entregas este mês</span>':''}</div>
        ${marcas}
        <div class="acoes"><a class="btn pri" href="${p.url}">Abrir painel</a><button class="btn sec" data-copiar="${p.url}">Copiar link</button></div>
      </div></article>`}).join('');
}
function iniciar(){
const tot=k=>P.reduce((s,p)=>s+p[k],0);
$('#stats').innerHTML=[[P.length,'painéis'],[P.reduce((s,p)=>s+p.marcas.length,0),'marcas'],[tot('total'),'conteúdos'],[tot('videos'),'vídeos']]
  .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

render();
}
$('#busca').addEventListener('input',render);
$('#ord').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ordem=b.dataset.o;document.querySelectorAll('#ord button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-copiar]');if(!b)return;
  const url=new URL(b.dataset.copiar,location.href).href;
  const ok=()=>{$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1600)};
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(ok).catch(()=>{prompt('Copie o link:',url)});
});
// ---------- senha: os dados só existem decifrados com ela ----------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const chave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(CIFRA.sal),iterations:CIFRA.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const txt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(CIFRA.iv)},chave,b64(CIFRA.ct));
  return JSON.parse(new TextDecoder().decode(txt));
}
const guardar={get(){try{return localStorage.getItem('aresta-hub')}catch(e){return null}},
  set(v){try{v?localStorage.setItem('aresta-hub',v):localStorage.removeItem('aresta-hub')}catch(e){}}};
async function entrar(senha,lembrar){
  P=await abrir(senha);
  if(lembrar)guardar.set(senha);
  $('#gate').hidden=true;$('#sair').hidden=false;iniciar();
}
$('#fGate').addEventListener('submit',async e=>{
  e.preventDefault();$('#erro').textContent='';
  try{await entrar($('#senha').value,$('#lembrar').checked)}catch(err){$('#erro').textContent='Senha incorreta.';$('#senha').select()}
});
$('#sair').onclick=()=>{guardar.set(null);location.reload()};
const salva=guardar.get();
if(salva)entrar(salva,true).catch(()=>guardar.set(null));
</script>
</body>
</html>
