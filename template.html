<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040404; --ink:#F8F4F2; --ink-2:#d9d2ce; --muted:#8f8784;
    --line:#232323; --card:#0f0f0f; --card-2:#161616; --accent:#882725; --accent-dark:#3c1e1e; --gold:#F6AD03;
    --radius:14px;
    --sans:"Inter Tight", "Nimbus Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif:"Instrument Serif", Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  img{display:block;max-width:100%}

  /* ---------- Header ---------- */
  .top{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:28px clamp(20px,5vw,64px)}
  .brand{display:flex;align-items:center;gap:12px;color:#fff}
  .brand-mark{width:40px;height:40px;object-fit:contain}
  .brand-name{font-weight:700;letter-spacing:.14em;font-size:15px}
  .top-tag{color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.08em;text-transform:uppercase}

  /* ---------- Hero ---------- */
  .hero{position:relative;min-height:min(92vh,820px);display:flex;align-items:flex-end;justify-content:center;text-align:center;overflow:hidden;background:var(--bg)}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transform:scale(1.04);filter:saturate(.9)}
  .mosaic{position:absolute;inset:-60px -20px;display:flex;gap:8px;filter:saturate(.9)}
  .mcol{flex:1;display:flex;flex-direction:column;gap:8px;animation:drift 60s ease-in-out infinite alternate}
  .mcol:nth-child(even){animation-direction:alternate-reverse;margin-top:-90px}
  .mtile{width:100%;border-radius:6px;background:#3c1e1e center/cover no-repeat;flex:none}
  .mtile.v{aspect-ratio:9/16}.mtile.p{aspect-ratio:4/5}
  @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-120px)}}
  @media (prefers-reduced-motion:reduce){.mcol{animation:none}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,4,.7) 0%,rgba(4,4,4,.4) 30%,rgba(4,4,4,.6) 55%,rgba(4,4,4,1) 100%)}
  .hero-inner{position:relative;z-index:2;color:#fff;padding:0 24px clamp(56px,9vh,96px);max-width:900px}
  .eyebrow{font-size:13px;letter-spacing:.42em;text-transform:uppercase;opacity:.85;margin-bottom:18px}
  .hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,10vw,128px);line-height:.95;letter-spacing:-.01em}
  .hero h1 em{font-style:italic;color:var(--gold)}
  .meta{margin-top:18px;font-size:clamp(16px,1.6vw,20px);opacity:.9}
  .cta{margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:10px;font-weight:600;font-size:16px;transition:transform .15s ease,background .15s ease,opacity .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:#fff;color:#040404}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}
  .btn svg{width:16px;height:16px;flex:none}

  /* ---------- Content ---------- */
  main{padding:56px clamp(20px,5vw,64px) 80px;max-width:1360px;margin:0 auto}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;color:var(--ink-2);transition:all .15s}
  .chip:hover{border-color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip .n{opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
  .hint{font-size:14px;color:var(--muted)}

  .section-title{font-family:var(--serif);font-size:clamp(32px,3.4vw,44px);font-weight:400;margin:8px 0 20px}
  .section{margin-bottom:56px}
  .section[hidden]{display:none}
  .modo-fotos .pgrid{columns:3 320px;column-gap:18px}
  .modo-fotos .pitem{margin-bottom:18px}
  .modo-videos .vgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}

  /* video cards */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
  .vcard{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
  .vcard:hover{transform:translateY(-3px);border-color:#333;box-shadow:0 18px 40px -18px rgba(136,39,37,.45)}
  .vthumb{position:relative;aspect-ratio:9/16;background:var(--card-2) center/cover no-repeat;cursor:pointer}
  .vthumb.h{aspect-ratio:16/9}
  .vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(4,4,4,.45))}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2;transition:transform .2s}
  .vthumb:hover .play{transform:translate(-50%,-50%) scale(1.08)}
  .play svg{width:20px;height:20px;margin-left:3px;fill:var(--accent)}
  .badge{position:absolute;left:12px;top:12px;z-index:2;background:rgba(4,4,4,.62);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:6px;letter-spacing:.04em}
  .vbody{padding:16px 16px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
  .vtitle{font-weight:600;font-size:17px;line-height:1.25}
  .vsub{font-size:14px;color:var(--muted)}
  .vactions{display:flex;gap:8px;margin-top:14px}
  .sbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--line);transition:all .15s}
  .sbtn svg{width:15px;height:15px}
  .sbtn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .sbtn:hover{border-color:var(--muted)}
  .sbtn.dark:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  /* photo grid */
  .pgrid{columns:4 260px;column-gap:16px}
  .pitem{break-inside:avoid;margin-bottom:16px;position:relative;border-radius:12px;overflow:hidden;background:var(--card-2);cursor:zoom-in;min-height:80px}
  .pitem img{width:100%;height:auto;transition:transform .35s ease}
  .pitem:hover img{transform:scale(1.03)}
  .pdl{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:#040404;display:grid;place-items:center;opacity:0;transform:translateY(4px);transition:all .2s}
  .pitem:hover .pdl,.pitem:focus-within .pdl{opacity:1;transform:none}
  .pdl svg{width:16px;height:16px}
  @media (hover:none){.pdl{opacity:1;transform:none}}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(4,4,4,.92);display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .modal-close{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center}
  .modal-close:hover{background:rgba(255,255,255,.22)}
  .mwrap{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%;max-height:100%}
  .frame{background:#000;border-radius:12px;overflow:hidden}
  .frame.v{height:min(80vh,900px);aspect-ratio:9/16;max-width:92vw}
  .frame.h{width:min(1100px,92vw);aspect-ratio:16/9;max-height:78vh}
  .frame iframe{width:100%;height:100%;border:0;display:block}
  .mimg{max-width:92vw;max-height:80vh;border-radius:10px;object-fit:contain}
  .mbar{display:flex;align-items:center;gap:16px;color:#fff;flex-wrap:wrap;justify-content:center}
  .mbar .t{font-weight:600}
  .mbar .s{opacity:.65;font-size:14px}
  .mbar .sbtn{flex:none;background:#fff;color:#040404;border-color:#fff}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:grid;place-items:center}
  .nav:hover{background:rgba(255,255,255,.22)}
  .nav.prev{left:18px}.nav.next{right:18px}

  /* ---------- Footer ---------- */
  footer{border-top:1px solid var(--line);padding:36px clamp(20px,5vw,64px);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px;max-width:1360px;margin:0 auto}
  footer strong{color:var(--ink);letter-spacing:.12em}
  footer a.wa{display:inline-flex;align-items:center;gap:8px;margin-left:8px;padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;transition:background .15s}
  footer a.wa:hover{background:#a3302d}
  footer a.wa svg{width:16px;height:16px}

  @media (max-width:640px){
    .top-tag{display:none}
    .vgrid{grid-template-columns:repeat(2,1fr);gap:12px}
    .vbody{padding:12px}
    .vtitle{font-size:15px}
    .vactions{flex-direction:column}
    .play{width:48px;height:48px}
    .pgrid,.modo-fotos .pgrid{columns:2;column-gap:10px}
    .modo-videos .vgrid{grid-template-columns:repeat(2,1fr);gap:12px}
    .pitem{margin-bottom:10px}
    .nav{display:none}
    .btn{padding:13px 20px;font-size:15px}
  }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="https://www.arestagencia.com.br" target="_blank" rel="noopener">
    <img class="brand-mark" src="data:image/png;base64,{{LOGO}}" alt="ArestAgência">
    <span class="brand-name">ARESTAGÊNCIA</span>
  </a>
  <span class="top-tag">Entrega de conteúdo</span>
</header>

<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-inner">
    <p class="eyebrow">ArestAgência apresenta</p>
    <h1 id="clientName"></h1>
    <p class="meta" id="heroMeta"></p>
    <div class="cta">
      <button class="btn btn-primary" id="playFirst">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span id="playLabel">Assistir</span>
      </button>
      <a class="btn btn-ghost" id="downloadAll" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>Baixar tudo
      </a>
    </div>
  </div>
</section>

<main>
  <div class="bar">
    <div class="chips" role="group" aria-label="Filtrar">
      <button class="chip" data-f="todos" aria-pressed="true">Todos<span class="n" id="nAll"></span></button>
      <button class="chip" data-f="videos" aria-pressed="false">Vídeos<span class="n" id="nVid"></span></button>
      <button class="chip" data-f="fotos" aria-pressed="false">Fotos<span class="n" id="nFot"></span></button>
    </div>
    <p class="hint" id="hint">Assista aqui ou baixe os arquivos originais em alta qualidade.</p>
  </div>

  <section class="section" id="secVideos">
    <h2 class="section-title" id="tVid">Vídeos</h2>
    <div class="vgrid" id="vgrid"></div>
  </section>

  <section class="section" id="secFotos">
    <h2 class="section-title" id="tFot">Fotos</h2>
    <div class="pgrid" id="pgrid"></div>
  </section>
</main>

<footer>
  <div><strong>ARESTAGÊNCIA</strong> · Produção audiovisual · Brasília</div>
  <div>Dúvidas sobre a entrega? <a class="wa" href="https://wa.me/5561991283546?text=Ol%C3%A1%2C%20como%20vai%3F%20Tenho%20uma%20d%C3%BAvida%20sobre%20a%20minha%20entrega." target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-1.4-.6-2.3-1.2-3.2-2.7-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>Fale com a gente</a></div>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="modal-close" id="mClose" aria-label="Fechar">×</button>
  <button class="nav prev" id="mPrev" aria-label="Anterior">‹</button>
  <button class="nav next" id="mNext" aria-label="Próximo">›</button>
  <div class="mwrap" id="mWrap"></div>
</div>

<script>
const DATA = /*__DATA__*/null;

const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';

const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const preview = id => `https://drive.google.com/file/d/${id}/preview`;
const download = id => `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`;
const fmtSize = b => b >= 1e9 ? (b/1e9).toFixed(1).replace('.',',')+' GB' : b >= 1e6 ? Math.round(b/1e6)+' MB' : Math.round(b/1e3)+' KB';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const V = DATA.videos, F = DATA.fotos;

// Hero
document.getElementById('clientName').textContent = DATA.cliente;
const metaParts = [];
if (V.length) metaParts.push(V.length + (V.length > 1 ? ' vídeos' : ' vídeo'));
if (F.length) metaParts.push(F.length + (F.length > 1 ? ' fotos' : ' foto'));
if (DATA.data) metaParts.push(DATA.data);
document.getElementById('heroMeta').textContent = (DATA.projeto ? DATA.projeto + ' · ' : '') + metaParts.join(' · ');
// Mosaico da capa: fotos + capas dos vídeos, intercalados
(function buildMosaic() {
  const tiles = [], max = Math.max(V.length, F.length);
  for (let i = 0; i < max; i++) {
    if (F[i]) tiles.push({ id: F[i].id, t: 'p' });
    if (V[i]) tiles.push({ id: V[i].id, t: 'v' });
  }
  const bg = document.getElementById('heroBg');
  if (!tiles.length) { if (DATA.capa) bg.style.backgroundImage = `url("${thumb(DATA.capa, 2000)}")`; return; }
  const cols = innerWidth < 640 ? 3 : innerWidth < 1100 ? 5 : 7;
  const perCol = innerWidth < 640 ? 6 : 5;
  // repete os itens até preencher a tela, sem repetir lado a lado
  const need = cols * perCol, list = [];
  for (let k = 0; list.length < need; k++) list.push(tiles[k % tiles.length]);
  const m = document.createElement('div'); m.className = 'mosaic';
  for (let c = 0; c < cols; c++) {
    const col = document.createElement('div'); col.className = 'mcol';
    for (let r = 0; r < perCol; r++) {
      const it = list[r * cols + c];
      const d = document.createElement('div');
      d.className = 'mtile ' + it.t;
      d.style.backgroundImage = `url("${thumb(it.id, 500)}")`;
      col.appendChild(d);
    }
    m.appendChild(col);
  }
  bg.replaceWith(m);
})();
// Baixar tudo: usa o .zip da entrega, se existir na pasta; senão abre a pasta no Drive
const dlAll = document.getElementById('downloadAll');
if (DATA.zip) {
  dlAll.href = download(DATA.zip.id);
  dlAll.lastChild.textContent = `Baixar tudo (${fmtSize(DATA.zip.bytes)})`;
} else {
  dlAll.href = DATA.pasta;
}
document.getElementById('nAll').textContent = V.length + F.length;
document.getElementById('nVid').textContent = V.length;
document.getElementById('nFot').textContent = F.length;
// Tipo de entrega: misto, só vídeos ou só fotos
const MODO = V.length && F.length ? 'misto' : V.length ? 'videos' : 'fotos';
document.body.classList.add('modo-' + MODO);
const hint = document.getElementById('hint');
if (MODO !== 'misto') {
  // sem filtros: a dica vai para baixo do título da seção
  document.querySelector('.bar').style.display = 'none';
  hint.style.margin = '-8px 0 24px';
  document.getElementById(MODO === 'videos' ? 'tVid' : 'tFot').after(hint);
}
if (MODO === 'videos') {
  hint.textContent = 'Assista aqui ou baixe cada vídeo no arquivo original.';
}
if (MODO === 'fotos') {
  const pf = document.getElementById('playFirst');
  pf.querySelector('svg').outerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>';
  document.getElementById('playLabel').textContent = 'Ver fotos';
  document.getElementById('tFot').textContent = 'Galeria';
  hint.textContent = 'Clique para ampliar e baixe cada foto no tamanho original.';
}

// Videos
document.getElementById('vgrid').innerHTML = V.map((v, i) => `
  <article class="vcard">
    <div class="vthumb ${v.orientacao === 'horizontal' ? 'h' : ''}" style="background-image:url('${thumb(v.id, 800)}')" data-play="${i}" role="button" tabindex="0" aria-label="Assistir ${esc(v.titulo)}">
      ${v.versao ? `<span class="badge">${esc(v.versao)}</span>` : ''}
      <span class="play">${ICON_PLAY}</span>
    </div>
    <div class="vbody">
      <h3 class="vtitle">${esc(v.titulo)}</h3>
      <p class="vsub">${esc([v.detalhe, fmtSize(v.bytes)].filter(Boolean).join(' · '))}</p>
      <div class="vactions">
        <button class="sbtn dark" data-play="${i}">${ICON_PLAY.replace('<svg','<svg fill="currentColor"')}Assistir</button>
        <a class="sbtn" href="${download(v.id)}" target="_blank" rel="noopener">${ICON_DL}Baixar</a>
      </div>
    </div>
  </article>`).join('');

// Photos
document.getElementById('pgrid').innerHTML = F.map((p, i) => `
  <figure class="pitem" data-photo="${i}" tabindex="0">
    <img src="${thumb(p.id, 900)}" alt="${esc(p.arquivo)}" loading="lazy">
    <a class="pdl" href="${download(p.id)}" target="_blank" rel="noopener" aria-label="Baixar ${esc(p.arquivo)}" onclick="event.stopPropagation()">${ICON_DL}</a>
  </figure>`).join('');

// Filters
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  const f = c.dataset.f;
  document.getElementById('secVideos').hidden = f === 'fotos' || !V.length;
  document.getElementById('secFotos').hidden = f === 'videos' || !F.length;
}));
document.getElementById('secVideos').hidden = !V.length;
document.getElementById('secFotos').hidden = !F.length;

// Modal
const modal = document.getElementById('modal'), wrap = document.getElementById('mWrap');
let cur = { type: null, i: 0 };
function render() {
  const list = cur.type === 'v' ? V : F, it = list[cur.i];
  if (cur.type === 'v') {
    wrap.innerHTML = `
      <div class="frame ${it.orientacao === 'horizontal' ? 'h' : 'v'}"><iframe src="${preview(it.id)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      <div class="mbar"><span class="t">${esc(it.titulo)}</span><span class="s">${esc(fmtSize(it.bytes))}</span>
      <a class="sbtn" href="${download(it.id)}" target="_blank" rel="noopener">${ICON_DL}Baixar original</a></div>`;
  } else {
    wrap.innerHTML = `
      <img class="mimg" src="${thumb(it.id, 2000)}" alt="${esc(it.arquivo)}">
      <div class="mbar"><span class="s">${cur.i + 1} de ${F.length}</span>
      <a class="sbtn" href="${download(it.id)}" target="_blank" rel="noopener">${ICON_DL}Baixar original</a></div>`;
  }
  const many = list.length > 1;
  document.getElementById('mPrev').style.visibility = many ? 'visible' : 'hidden';
  document.getElementById('mNext').style.visibility = many ? 'visible' : 'hidden';
}
function open(type, i) { cur = { type, i }; render(); modal.classList.add('open'); document.body.style.overflow = 'hidden'; }
function close() { modal.classList.remove('open'); wrap.innerHTML = ''; document.body.style.overflow = ''; }
function step(d) { const n = (cur.type === 'v' ? V : F).length; cur.i = (cur.i + d + n) % n; render(); }

document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]'); if (p) return open('v', +p.dataset.play);
  const f = e.target.closest('[data-photo]'); if (f) return open('f', +f.dataset.photo);
});
document.addEventListener('keydown', e => {
  if (modal.classList.contains('open')) {
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  } else if (e.key === 'Enter') {
    const t = document.activeElement;
    if (t?.dataset.play) open('v', +t.dataset.play);
    if (t?.dataset.photo) open('f', +t.dataset.photo);
  }
});
document.getElementById('mClose').onclick = close;
document.getElementById('mPrev').onclick = () => step(-1);
document.getElementById('mNext').onclick = () => step(1);
modal.addEventListener('click', e => { if (e.target === modal) close(); });
document.getElementById('playFirst').onclick = () => open(MODO === 'fotos' ? 'f' : 'v', 0);
</script>
</body>
</html>
